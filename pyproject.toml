[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kingkybel-pyjsonobject"
dynamic = ["version"]
description = "Standalone JsonObject helper utilities"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.8"
authors = [
    {name = "Dieter J Kybelksties", email = "github@kybelksties.com"}
]
maintainers = [
    {name = "Dieter J Kybelksties", email = "github@kybelksties.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["json", "object", "utilities"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "black", "mypy"]

[project.urls]
Homepage = "https://github.com/kingkybel/PyJsonObject"
Repository = "https://github.com/kingkybel/PyJsonObject"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["test*", "tools*", "docs*", "examples*"]

[tool.setuptools.dynamic.version]
attr = "pyjsonobject.__version__"
